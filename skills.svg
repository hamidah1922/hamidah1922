<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
<defs>
<style>
  .title { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 800; font-size: 30px; letter-spacing: 6px; fill: #ffb347; }
  .cat { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 3px; }
  .pill-text { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; font-size: 13px; }
  .pill { }
  .trace { fill: none; stroke-width: 2; stroke-linecap: round; animation: travel 3.2s linear infinite; }
  @keyframes travel { to { stroke-dashoffset: -400; } }
  .glowbar { animation: pulse 2.6s ease-in-out infinite; }
  .ring { animation: pulse 2.6s ease-in-out infinite; }
  .corner { stroke: #f5a623; stroke-width: 2; fill: none; opacity: .8; }
  .grid { stroke: #ffffff; stroke-opacity: .035; stroke-width: 1; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .25; }
  }
  @keyframes drift {
    0% { transform: translateX(0); }
    50% { transform: translateX(14px); }
    100% { transform: translateX(0); }
  }
  @keyframes glowshift {
    0%, 100% { stop-color: #f5a623; }
    50% { stop-color: #dc2626; }
  }

  @keyframes glitch {
    0%, 92%, 100% { transform: translate(0,0); opacity: 0; }
    93% { transform: translate(-3px,1px); opacity: .8; }
    95% { transform: translate(3px,-1px); opacity: .8; }
    97% { transform: translate(-2px,0); opacity: .6; }
  }
  @keyframes scan {
    0% { transform: translateY(-40px); }
    100% { transform: translateY(640px); }
  }

  .ember { animation: rise linear infinite; }
  @keyframes rise {
    0% { transform: translateY(0); opacity: 0; }
    10% { opacity: .9; }
    90% { opacity: .5; }
    100% { transform: translateY(-560px); opacity: 0; }
  }
</style>

<radialGradient id="bgGrad" cx="50%" cy="15%" r="90%">
  <stop offset="0%" stop-color="#161022"/>
  <stop offset="45%" stop-color="#0a0713"/>
  <stop offset="100%" stop-color="#020103"/>
</radialGradient>

<radialGradient id="vignette" cx="50%" cy="50%" r="75%">
  <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
  <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
</radialGradient>

<linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#f5a623"><animate attributeName="stop-color" values="#f5a623;#dc2626;#7c3aed;#0d9488;#f5a623" dur="8s" repeatCount="indefinite"/></stop>
  <stop offset="100%" stop-color="#38d3d8"><animate attributeName="stop-color" values="#7c3aed;#0d9488;#f5a623;#dc2626;#7c3aed" dur="8s" repeatCount="indefinite"/></stop>
</linearGradient>

<filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="4" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<filter id="softglow" x="-80%" y="-80%" width="260%" height="260%">
  <feGaussianBlur stdDeviation="8" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>
<linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
  <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
  <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
</defs>

<rect x="0" y="0" width="900" height="600" rx="18" fill="url(#bgGrad)"/>
<rect x="0" y="0" width="900" height="600" rx="18" fill="url(#vignette)"/>

<g clip-path="none">
  <g style="animation: drift 12s ease-in-out infinite;">
    <line class="grid" x1="0" y1="60" x2="900" y2="60"/>
    <line class="grid" x1="0" y1="180" x2="900" y2="180"/>
    <line class="grid" x1="0" y1="300" x2="900" y2="300"/>
    <line class="grid" x1="0" y1="420" x2="900" y2="420"/>
    <line class="grid" x1="0" y1="540" x2="900" y2="540"/>
  </g>
</g>

<rect x="3" y="3" width="894" height="594" rx="16" fill="none" stroke="url(#frameGrad)" stroke-width="5" opacity="0.22" filter="url(#softglow)"/>
<rect x="3" y="3" width="894" height="594" rx="16" fill="none" stroke="url(#frameGrad)" stroke-width="2" opacity="0.55"/>

<path class="corner" d="M24 60 L24 24 L60 24"/>
<path class="corner" d="M876 60 L876 24 L840 24"/>
<path class="corner" d="M24 540 L24 576 L60 576"/>
<path class="corner" d="M876 540 L876 576 L840 576"/>

<text x="450" y="58" text-anchor="middle" class="title" filter="url(#softglow)">TECH STACK</text>
<rect class="glowbar" x="370" y="72" width="160" height="2.5" fill="#f360c7" filter="url(#glow)"/>
<text x="447" y="58" text-anchor="middle" class="title" fill="#ee4ccb" style="animation: glitch 6s infinite; opacity:0;">TECH STACK</text>
<text x="453" y="58" text-anchor="middle" class="title" fill="#4c2dd4" style="animation: glitch 6s infinite .1s; opacity:0;">TECH STACK</text>
<rect x="0" y="0" width="900" height="40" fill="url(#scanGrad)" style="animation: scan 5s linear infinite;"/>
<text x="450" y="128" text-anchor="middle" class="cat" fill="#93c5fd" filter="url(#glow)">FRONTEND</text>
<rect x="395" y="136" width="110" height="1" fill="#2563eb" opacity="0.5"/>

<g>
<g class="pill" style="animation-delay:.00s"><rect x="200" y="158" width="60" height="34" rx="9" fill="#0c1830" stroke="#2563eb" stroke-width="1.3" filter="url(#glow)"/><text x="230" y="180" text-anchor="middle" class="pill-text" fill="#bfdbfe">HTML5</text><rect class="trace" x="200" y="158" width="60" height="34" rx="9" stroke="#2563eb" stroke-dasharray="30 250"/></g>

<g class="pill" style="animation-delay:.10s"><rect x="272" y="158" width="60" height="34" rx="9" fill="#0c1830" stroke="#2563eb" stroke-width="1.3" filter="url(#glow)"/><text x="302" y="180" text-anchor="middle" class="pill-text" fill="#bfdbfe">CSS3</text><rect class="trace" x="272" y="158" width="60" height="34" rx="9" stroke="#2563eb" stroke-dasharray="30 250"/></g>

<g class="pill" style="animation-delay:.20s"><rect x="344" y="158" width="120" height="34" rx="9" fill="#0c1830" stroke="#2563eb" stroke-width="1.3" filter="url(#glow)"/><text x="404" y="180" text-anchor="middle" class="pill-text" fill="#bfdbfe">JAVASCRIPT</text><rect class="trace" x="344" y="158" width="120" height="34" rx="9" stroke="#2563eb" stroke-dasharray="30 250"/></g>

<g class="pill" style="animation-delay:.30s"><rect x="476" y="158" width="70" height="34" rx="9" fill="#0c1830" stroke="#2563eb" stroke-width="1.3" filter="url(#glow)"/><text x="511" y="180" text-anchor="middle" class="pill-text" fill="#bfdbfe">REACT</text><rect class="trace" x="476" y="158" width="70" height="34" rx="9" stroke="#2563eb" stroke-dasharray="30 250"/></g>

<g class="pill" style="animation-delay:.40s"><rect x="558" y="158" width="140" height="34" rx="9" fill="#0c1830" stroke="#2563eb" stroke-width="1.3" filter="url(#glow)"/><text x="628" y="180" text-anchor="middle" class="pill-text" fill="#bfdbfe">TAILWIND CSS</text><rect class="trace" x="558" y="158" width="140" height="34" rx="9" stroke="#2563eb" stroke-dasharray="30 250"/></g>
</g>

<text x="450" y="248" text-anchor="middle" class="cat" fill="#fca5a5" filter="url(#glow)">BACKEND</text>
<rect x="410" y="256" width="80" height="1" fill="#dc2626" opacity="0.5"/>

<g>
<g class="pill" style="animation-delay:.05s"><rect x="305" y="278" width="60" height="34" rx="9" fill="#2a0d0d" stroke="#dc2626" stroke-width="1.3" filter="url(#glow)"/><text x="335" y="300" text-anchor="middle" class="pill-text" fill="#fecaca">PHP</text><rect class="trace" x="305" y="278" width="60" height="34" rx="9" stroke="#dc2626" stroke-dasharray="30 250"/></g>

<g class="pill" style="animation-delay:.15s"><rect x="375" y="278" width="70" height="34" rx="9" fill="#2a0d0d" stroke="#dc2626" stroke-width="1.3" filter="url(#glow)"/><text x="410" y="300" text-anchor="middle" class="pill-text" fill="#fecaca">MYSQL</text><rect class="trace" x="375" y="278" width="70" height="34" rx="9" stroke="#dc2626" stroke-dasharray="30 250"/></g>

<g class="pill" style="animation-delay:.25s"><rect x="455" y="278" width="80" height="34" rx="9" fill="#2a0d0d" stroke="#dc2626" stroke-width="1.3" filter="url(#glow)"/><text x="495" y="300" text-anchor="middle" class="pill-text" fill="#fecaca">NODE.JS</text><rect class="trace" x="455" y="278" width="80" height="34" rx="9" stroke="#dc2626" stroke-dasharray="30 250"/></g>

<g class="pill" style="animation-delay:.35s"><rect x="545" y="278" width="80" height="34" rx="9" fill="#2a0d0d" stroke="#dc2626" stroke-width="1.3" filter="url(#glow)"/><text x="585" y="300" text-anchor="middle" class="pill-text" fill="#fecaca">PYTHON</text><rect class="trace" x="545" y="278" width="80" height="34" rx="9" stroke="#dc2626" stroke-dasharray="30 250"/></g>
</g>
<text x="450" y="368" text-anchor="middle" class="cat" fill="#c4b5fd" filter="url(#glow)">DESIGN</text>
<rect x="410" y="376" width="80" height="1" fill="#7c3aed" opacity="0.5"/>

<g>
<g class="pill" style="animation-delay:.10s"><rect x="367" y="398" width="72" height="34" rx="9" fill="#180d2a" stroke="#7c3aed" stroke-width="1.3" filter="url(#glow)"/><text x="403" y="420" text-anchor="middle" class="pill-text" fill="#ddd6fe">FIGMA</text><rect class="trace" x="367" y="398" width="72" height="34" rx="9" stroke="#7c3aed" stroke-dasharray="30 250"/></g>

<g class="pill" style="animation-delay:.20s"><rect x="451" y="398" width="82" height="34" rx="9" fill="#180d2a" stroke="#7c3aed" stroke-width="1.3" filter="url(#glow)"/><text x="492" y="420" text-anchor="middle" class="pill-text" fill="#ddd6fe">CANVA</text><rect class="trace" x="451" y="398" width="82" height="34" rx="9" stroke="#7c3aed" stroke-dasharray="30 250"/></g>
</g>
<text x="450" y="488" text-anchor="middle" class="cat" fill="#5eead4" filter="url(#glow)">TOOLS</text>
<rect x="410" y="496" width="80" height="1" fill="#0d9488" opacity="0.5"/>

<g>
<g class="pill" style="animation-delay:.05s"><rect x="319" y="518" width="116" height="34" rx="9" fill="#06211d" stroke="#0d9488" stroke-width="1.3" filter="url(#glow)"/><text x="377" y="540" text-anchor="middle" class="pill-text" fill="#99f6e4">GITHUB</text><rect class="trace" x="319" y="518" width="116" height="34" rx="9" stroke="#0d9488" stroke-dasharray="30 250"/></g>

<g class="pill" style="animation-delay:.15s"><rect x="447" y="518" width="134" height="34" rx="9" fill="#06211d" stroke="#0d9488" stroke-width="1.3" filter="url(#glow)"/><text x="514" y="540" text-anchor="middle" class="pill-text" fill="#99f6e4">VS CODE</text><rect class="trace" x="447" y="518" width="134" height="34" rx="9" stroke="#0d9488" stroke-dasharray="30 250"/></g>
</g>

